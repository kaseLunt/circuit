name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      # ESLint parses scripts/ but does not reject a duplicate top-level declaration that
      # Node refuses to load, so the evidence-regeneration script gets an explicit parse gate.
      # Observed 2026-07-25: lint exit 0 on bytes Node rejected with SyntaxError.
      - run: npm run check:scripts
      - run: npm test

  fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Anvil pinned to the W03 fixture toolchain version.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: npm ci
      # FORK_RPC_URL is a REQUIRED repository secret and must be archive-capable —
      # the pinned block has aged out of public nodes' recent-state windows (W03).
      - run: npm run test:fork
        env:
          FORK_RPC_URL: ${{ secrets.FORK_RPC_URL }}
